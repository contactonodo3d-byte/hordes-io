<!doctype html><html><head><meta charset="utf-8"><title>Hordes.io — audio check</title><link rel="stylesheet" href="../style.css"></head><body><main><h2>Audio playback check</h2><p id="status">Press Test Sound to unlock browser audio.</p><button id="test">TEST SOUND</button></main><script type="module">import {loadPilotAssets} from "../src/pilot-assets.js";await loadPilotAssets();
import {GameAudio} from '../src/audio.js';const audio=new GameAudio({muted:false,music:.22,sfx:.65});let peak=0;document.querySelector('#test').onclick=async()=>{await audio.unlock();if(!audio.ctx){document.querySelector('#status').textContent='Web Audio unavailable';return;}audio.setPlaying(true);audio.play('start');const analyser=audio.ctx.createAnalyser();analyser.fftSize=256;audio.master.connect(analyser);const data=new Float32Array(256);function check(){audio.update();analyser.getFloatTimeDomainData(data);for(const value of data)peak=Math.max(peak,Math.abs(value));document.querySelector('#status').textContent='Audio '+audio.ctx.state+' · signal peak '+peak.toFixed(4)+' · '+(peak>.0001?'PASS':'Waiting for signal');requestAnimationFrame(check);}requestAnimationFrame(check);};
</script></body></html>
