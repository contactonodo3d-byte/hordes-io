<!doctype html><html><head><meta charset="utf-8"><title>Hordes.io — ruler animation gallery</title><link rel="stylesheet" href="../style.css"></head><body><canvas id="arena"></canvas><div class="brand">HORDES<span>.IO</span><small>LEFT / RIGHT · FOOT / MOUNTED</small></div><div class="hint">Distinct rulers · Animated mounts · Food supplies · Wandering recruits</div><script type="module">import {loadPilotAssets} from "../src/pilot-assets.js";await loadPilotAssets();
import {Renderer} from '../src/renderer.js';import {FACTIONS} from '../src/config.js';const r=new Renderer(document.querySelector('canvas'));function draw(ms){const c=r.ctx,t=ms/1000;c.fillStyle='#203a32';c.fillRect(0,0,r.w,r.h);c.textAlign='center';const factions=Object.keys(FACTIONS),spacing=r.w/6,top=130;for(let i=0;i<6;i++){const f=FACTIONS[factions[i]],x=spacing*(i+.5);c.fillStyle=f.shield;c.font='bold 17px system-ui';c.fillText(f.name,x,top);c.fillStyle='#b5c9bc';c.font='12px system-ui';c.fillText(f.title,x,top+23);const foot=r.leaderSprite(factions[i],false,8+Math.floor(t*4)%4),mount=r.leaderSprite(factions[i],true,1+Math.floor(t*9)%3,-1);c.drawImage(foot,x-55,top+45,110,136);c.drawImage(mount,x-55,top+220,110,136);}const items=[['supplies','meat','Meat'],['supplies','fruit','Fruit'],['supplies','drink','Beverage'],['recruit','wanderer','Wanderer +2'],['recruit','bandit','Bandit +2']];items.forEach(([kind,appearance,label],i)=>{const x=r.w*(i+1)/6,y=r.h-112;r.item({x,y,kind,appearance},t);c.fillStyle='#cbd6c7';c.font='12px system-ui';c.fillText(label,x,y+42);});requestAnimationFrame(draw);}requestAnimationFrame(draw);addEventListener('resize',()=>r.resize());
</script></body></html>
