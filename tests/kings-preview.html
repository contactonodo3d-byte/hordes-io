<!doctype html><html><head><meta charset="utf-8"><title>Village and king animations</title><style>body{margin:0;background:#29463b;color:#eee;font:16px system-ui}header{position:absolute;top:20px;left:30px}canvas{width:100vw;height:100vh}</style></head><body><header>5× village · small army +200 · desperate retreat · fallen king</header><canvas></canvas><script type="module">import {loadPilotAssets} from "../src/pilot-assets.js";await loadPilotAssets();import {Simulation} from '../src/simulation.js';import {Renderer} from '../src/renderer.js';const s=new Simulation(()=>.5);s.resources=[];s.hordes=[s.player];s.player.units.add(16);s.damage(s.player,48);s.player.desperate=true;s.player.moving=true;const dead=s.makeHorde('Fallen king',3250,3100,1,'red','romans');s.damage(dead,99);s.spawnResource(2750,2950,'village',{progress:6,assailant:s.player});const r=new Renderer(document.querySelector('canvas'));function frame(ms){const fall=s.effects.find(e=>e.kind==='kingFall');fall.life=1.4-(ms/1000%1.4);r.draw(s,ms/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
