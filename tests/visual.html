<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hordes.io — battle visual check</title><link rel="stylesheet" href="../style.css"></head><body><canvas id="arena"></canvas><div class="brand">HORDES<span>.IO</span><small>BATTLE / ASSAULT TEST SCENE</small></div><aside><h3>⚑ CLASIFICACIÓN</h3><ol id="board"></ol></aside><div class="hint" id="status"></div><script type="module">import {loadPilotAssets} from "../src/pilot-assets.js";await loadPilotAssets();
import {Simulation} from '../src/simulation.js';import {Renderer} from '../src/renderer.js';import {CONFIG,FACTIONS} from '../src/config.js';
const s=new Simulation(()=>.42,'vikings');s.resources=[];s.hordes=[];s.time=30;s.respawnTimer=-999;s.eventTimer=999;s.player=s.makeHorde('Tú',3000,3000,30,'#eec569','vikings');const enemy=s.makeHorde('Ragnar',3220,3000,25,'#df8c78','vikings');s.hordes=[s.player,enemy];s.ai=()=>({x:0,y:0});s.collect(s.player,{kind:'horse'});s.spawnResource(2860,3000,'village',{progress:0,assailant:null});const renderer=new Renderer(document.querySelector('canvas'));let previous=0;
function frame(ms){const dt=Math.min(.05,(ms-previous)/1000||0);previous=ms;s.update(dt);renderer.draw(s,ms/1000);document.querySelector('#status').textContent=s.player.siege?'Village assault: '+Math.ceil(CONFIG.villageDuration-s.player.siege.village.progress)+'s · reward scales with army size · Horse boost active':'Village captured · recruits absorbed';document.querySelector('#board').replaceChildren(...s.rank().map((h,i)=>{const li=document.createElement('li'),span=document.createElement('span'),b=document.createElement('b');span.textContent=(i===0?'👑 '+FACTIONS[h.faction].title+' ':i+1+'. ')+h.name;const small=document.createElement('small');small.className='battle-label';small.textContent=h.opponents.length?'⚔ vs '+h.opponents.join(', '):h.siege?'⚔ Assaulting village':'';span.append(small);b.textContent=h.units.length;li.append(span,b);return li;}));requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>renderer.resize());
</script></body></html>
