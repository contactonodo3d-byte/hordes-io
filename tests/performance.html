<!doctype html><html><head><meta charset="utf-8"><title>Hordes.io — crowded army benchmark</title><link rel="stylesheet" href="../style.css"></head><body><canvas id="arena"></canvas><div class="brand">HORDES<span>.IO</span><small>13 MILLION SOLDIERS · BOUNDED RENDER CHECK</small></div><div id="measure" class="hint">Warming sprite cache…</div><script type="module">import {loadPilotAssets} from "../src/pilot-assets.js";await loadPilotAssets();
import {Simulation} from '../src/simulation.js';import {Renderer} from '../src/renderer.js';import {FACTIONS} from '../src/config.js';
const sim=new Simulation(()=>.5);sim.resources=[];sim.traces=[];sim.effects=[];sim.hordes=[];const factions=Object.keys(FACTIONS);for(let i=0;i<13;i++){const h=sim.makeHorde('Army '+i,3000+(i%4-1.5)*140,3000+(Math.floor(i/4)-1.5)*115,1_000_000,'#eec569',factions[i%6]);h.moving=true;h.mount=i%2?'horse':null;h.speedUntil=99;h.attackUntil=99;sim.hordes.push(h);}sim.player=sim.hordes[5];const renderer=new Renderer(document.querySelector('canvas'));renderer.camera={x:3000,y:3000};const cached=renderer.unit;const values={cached:[],vector:[]};let tick=0,frames=[],last=0;function draw(ms){const dt=(ms-last)/1000;last=ms;if(tick===0||tick===10||tick===35){renderer.unit=cached;for(let frame=0;frame<8;frame++)renderer.draw(sim,frame/12);}let mode=tick<10?'warm':tick<35?'cached':'vector';renderer.unit=mode==='vector'?renderer.paintUnit:cached;const begin=performance.now();renderer.draw(sim,tick/12);const elapsed=performance.now()-begin;if(mode!=='warm')values[mode].push(elapsed);tick++;if(tick<60)requestAnimationFrame(draw);else{renderer.unit=cached;const median=a=>a.sort((x,y)=>x-y)[Math.floor(a.length/2)];const a=median(values.cached),b=median(values.vector);document.querySelector('#measure').textContent='13,000,000 soldiers / ≤1,248 sprites · cached median '+a.toFixed(2)+' ms · shape redraw '+b.toFixed(2)+' ms · '+(b/a).toFixed(1)+'× faster rendering';window.benchmarkResult={units:13_000_000,cachedMedianMs:a,vectorMedianMs:b,speedup:b/a};requestAnimationFrame(animate);}}
function animate(ms){renderer.draw(sim,ms/1000);requestAnimationFrame(animate);}requestAnimationFrame(draw);
</script></body></html>
